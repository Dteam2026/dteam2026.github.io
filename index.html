
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PAIK'S COFFEE MENU</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #fff;
    color: #222;
}

/* HEADER */
header {
    padding: 22px 5%;
    border-bottom: 1px solid #eee;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 27px;
    font-weight: 900;
    color: #173d78;
}

.logo span {
    color: #e6b900;
}

nav {
    color: #555;
    font-size: 14px;
}

/* BANNER */
.banner {
    display: none;
    margin: 25px auto;
    max-width: 1060px;
    min-height: 260px;
    background: #f5f1e9;
    border-radius: 12px;
    overflow: hidden;
    align-items: center;
    justify-content: space-around;
    padding: 20px;
}

.banner.show {
    display: flex;
}

.banner-text {
    padding: 20px;
}

.banner-text h1 {
    color: #173d78;
    font-size: 30px;
}

.banner-text p {
    font-size: 16px;
    line-height: 1.7;
}

.banner img {
    width: 220px;
    height: 220px;
    object-fit: cover;
    border-radius: 10px;
}

/* TITLE */
.menu-title {
    text-align: center;
    margin: 35px 0 25px;
}

.menu-title h2 {
    font-size: 28px;
    color: #173d78;
}

.menu-title p {
    color: #888;
}

/* MENU GRID */
.menu {
    max-width: 1100px;
    margin: auto;
    padding: 0 8px 40px;
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 30px 17px;
}

.product {
    min-width: 0;
    cursor: pointer;
}

.product-image {
    height: 200px;
    background: #f5f5f5;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
}

.product-image img {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

.drink-icon {
    font-size: 85px;
}

.product button {
    width: 100%;
    margin-top: 8px;
    padding: 7px;
    background: white;
    border: 1px solid #d2d8e0;
    border-radius: 3px;
    cursor: pointer;
    font-size: 13px;
}

.product button:hover {
    background: #f0f4fa;
}

.store {
    color: #999;
    font-size: 11px;
    margin-top: 9px;
}

.name {
    font-size: 13px;
    margin-top: 5px;
    line-height: 1.5;
}

.price {
    font-weight: bold;
    font-size: 15px;
    margin-top: 4px;
}

.rating {
    color: #ff5145;
    font-size: 12px;
    margin-top: 5px;
}

/* RESULT */
.result {
    max-width: 650px;
    margin: 20px auto 50px;
    padding: 25px;
    background: #f4f6f9;
    text-align: center;
    border-radius: 10px;
}

.result h3 {
    color: #173d78;
}

footer {
    background: #173d78;
    color: white;
    text-align: center;
    padding: 20px;
}

/* MOBILE */
@media (max-width: 700px) {
    .menu {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .product-image {
        height: 170px;
    }

    .banner img {
        width: 130px;
        height: 170px;
    }

    .banner-text h1 {
        font-size: 21px;
    }

    nav {
        display: none;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">PAIK'S <span>COFFEE</span></div>
    <nav>HOME　　MENU　　EVENT　　ABOUT US</nav>
</header>

<!-- JANG WONYOUNG BANNER: VERSION B -->
<section class="banner" id="modelBanner">

    <div class="banner-text">
        <h1>오늘은 빽다방과 함께!</h1>
        <p>
            장원영과 함께하는 특별한 커피 타임 ☕<br>
            당신이 가장 좋아하는 메뉴를 선택해 보세요!
        </p>
    </div>

    <img
      src="images/wonyoung.jpg"
      alt="Jang Wonyoung"
      onerror="this.style.display='none'"
    >

</section>

<div class="menu-title">
    <h2>PAIK'S COFFEE MENU</h2>
    <p>당신의 취향에 맞는 음료를 선택해 보세요.</p>
</div>

<!-- PRODUCT MENU -->
<div class="menu" id="menu"></div>

<!-- CLICK RESULT -->
<section class="result">
    <h3>MENU 선택 결과</h3>
    <p id="message">원하는 음료를 선택해 주세요!</p>
    <p>나의 메뉴 선택 횟수: <strong id="myClicks">0</strong></p>
</section>

<footer>
    PAIK'S COFFEE A/B TESTING PROJECT
    <p>소비자 클릭 행동 분석 실험</p>
</footer>

<script>

// 1. RANDOMLY ASSIGN VERSION A OR B
let version = localStorage.getItem("testVersion");

if (!version) {
    version = Math.random() < 0.5 ? "A" : "B";
    localStorage.setItem("testVersion", version);
}

// VERSION B SHOWS JANG WONYOUNG BANNER
if (version === "B") {
    document.getElementById("modelBanner").classList.add("show");
}

// 2. PRODUCT DATA
const products = [
    {
        name: "블루드브라떼 (ICE)",
        price: "4,500원",
        icon: "🥤",
        image: "images/drink1.jpg"
    },
    {
        name: "소세지빵 + 아메리카노 (ICE)",
        price: "5,500원",
        icon: "🌭",
        image: "images/drink2.jpg"
    },
    {
        name: "바나나밀크쉐이크",
        price: "4,300원",
        icon: "🍌",
        image: "images/drink3.jpg"
    },
    {
        name: "바닐라 음료 (ICE)",
        price: "2,000원",
        icon: "🧋",
        image: "images/drink4.jpg"
    },
    {
        name: "민트초코 음료",
        price: "3,800원",
        icon: "🍫",
        image: "images/drink5.jpg"
    },
    {
        name: "아이스티 샷추가",
        price: "3,400원",
        icon: "🧊",
        image: "images/drink6.jpg"
    },
    {
        name: "디카페인 콜드브루 (ICE)",
        price: "4,000원",
        icon: "☕",
        image: "images/drink7.jpg"
    },
    {
        name: "토피넛라떼 (ICE)",
        price: "3,500원",
        icon: "🥛",
        image: "images/drink8.jpg"
    },
    {
        name: "밀크티 (HOT)",
        price: "3,500원",
        icon: "🧋",
        image: "images/drink9.jpg"
    },
    {
        name: "블루드브루 (ICE)",
        price: "4,000원",
        icon: "🥤",
        image: "images/drink10.jpg"
    }
];

// 3. CLICK COUNTER
let myClicks = Number(
    localStorage.getItem("myClicks") || 0
);

document.getElementById("myClicks").textContent = myClicks;

// 4. DISPLAY MENU
const menu = document.getElementById("menu");

products.forEach((product, index) => {

    const card = document.createElement("div");
    card.className = "product";

    card.innerHTML = `
        <div class="product-image">
            <span class="drink-icon">${product.icon}</span>
            <img
                src="${product.image}"
                alt="${product.name}"
                onload="this.previousElementSibling.style.display='none'"
                onerror="this.style.display='none'"
            >
        </div>

        <button onclick="selectProduct('${product.name}')">
            ♡ 선물하기
        </button>

        <div class="store">빽다방스토어</div>
        <div class="name">[빽다방] ${product.name}</div>
        <div class="price">${product.price}</div>
        <div class="rating">★ 5.0</div>
    `;

    card.addEventListener("click", function() {
        selectProduct(product.name);
    });

    menu.appendChild(card);
});

// 5. RECORD PRODUCT CLICKS
function selectProduct(name) {

    myClicks++;

    localStorage.setItem("myClicks", myClicks);

    // Record clicks by version on this browser
    let key = "clicks_" + version;
    let total = Number(localStorage.getItem(key) || 0);

    localStorage.setItem(key, total + 1);

    document.getElementById("myClicks").textContent = myClicks;

    document.getElementById("message").textContent =
        "선택한 메뉴: " + name;

}

</script>

</body>
</html>
